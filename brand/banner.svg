<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-label="Attest — proof of close for Indian merchants">
  <title>Attest</title>
  <defs>
    <radialGradient id="cg1" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#FBE9A8"/><stop offset="34%" stop-color="#F2CB5C"/>
      <stop offset="64%" stop-color="#DFA82A"/><stop offset="100%" stop-color="#B87C15"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
