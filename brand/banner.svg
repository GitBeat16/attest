  <text x="64" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#F1EDE4">Your books balance.</text>
  <text x="64" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic"
