  </defs>
  <rect width="1200" height="320" fill="#101319"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <g stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1">
    <line x1="0" y1="44" x2="1200" y2="44"/><line x1="0" y1="88" x2="1200" y2="88"/><line x1="0" y1="132" x2="1200" y2="132"/><line x1="0" y1="176" x2="1200" y2="176"/><line x1="0" y1="220" x2="1200" y2="220"/><line x1="0" y1="264" x2="1200" y2="264"/><line x1="0" y1="308" x2="1200" y2="308"/>
  </g>

  <g transform="translate(64 44) scale(1.5)" stroke="#DFA82A" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20.6 L16 4.6 L24 20.6" stroke-width="2.7"/><path d="M11.4 15.7 H20.6" stroke-width="2.7"/><path d="M8 24.6 H24" stroke-width="1.9"/><path d="M8 27.8 H24" stroke-width="1.9"/></g>
  <text x="130" y="80" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="27" font-weight="600"
