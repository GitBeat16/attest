  <ellipse cx="1010" cy="252" rx="60" ry="7" fill="#7A5410" fill-opacity=".3"/>
  <text x="1010" y="288" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11"
