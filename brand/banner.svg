    <circle r="77.1" fill="none" stroke="#FFF6DA" stroke-opacity=".5" stroke-width="4.51"/>
    <circle r="65.6" fill="none" stroke="#8A5A12" stroke-opacity=".3" stroke-width="1"/>
    <text y="28.7" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78"
